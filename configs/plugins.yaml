{
  "plugins": [
    {
      "name": "triangulation",
      "class": "fusion.plugins.TriangulationPlugin",
      "stage": "geometry",
      "enabled": true,
      "required_sources": ["rgb_camera", "depth_camera"]
    },
    {
      "name": "temporal_fusion",
      "class": "fusion.plugins.TemporalFusionPlugin",
      "stage": "temporal",
      "enabled": true,
      "required_sources": ["rgb_camera"]
    },
    {
      "name": "scene_graph",
      "class": "fusion.plugins.SceneGraphPlugin",
      "stage": "semantic",
      "enabled": true,
      "required_sources": ["rgb_camera"]
    }
  ]
}
