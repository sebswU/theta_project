{
  "sources": [
    {
      "id": "imu_base",
      "type": "imu",
      "adapter": "adapters.uri_sensor_adapter.URISensorAdapter",
      "uri": "ros2:///imu/data",
      "transport": "ros2",
      "topic": "/imu/data"
    },
    {
      "id": "websocket_skellycam",
      "type": "rgb_camera",
      "adapter": "adapters.skelly_api_bridge.SkellyApiBridgeAdapter",
      "uri": "ws://localhost:53117/skellycam/websocket/connect",
      "transport": "websocket",
      "supports_calibration": true,
      "supports_multiview": true,
      "calibration": "configs/calibration/skelly_api_bridge.yaml"
    }
  ]
}
