[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-cv-adapter"
version = "0.1.0"
description = "Universal integration platform scaffold for computer vision ecosystems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0,<3.0.0",
  "pydantic>=2.8.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.5.0,<1.0.0",
  "mypy>=1.10.0,<2.0.0",
]

[tool.pytest.ini_options]
addopts = "-ra --cov=. --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
ignore_missing_imports = true
exclude = "tests/"

[tool.setuptools.packages.find]
include = [
  "adapters*",
  "acquisition*",
  "architecture*",
  "configs*",
  "fusion*",
  "orchestration*",
  "registry*",
  "schemas*",
  "visualization*",
]
